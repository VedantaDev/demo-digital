openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: comments
    description: Issue discussion operations
  - name: issue-submissions
    description: Issue submission delivery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /comments:
    get:
      operationId: getIssueComments
      tags: [comments]
      summary: List comments for an issue
      parameters:
        - name: issue_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comments ordered from oldest to newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "400":
          description: Missing issue id
        "502":
          description: Comment service unavailable
    post:
      operationId: createIssueComment
      tags: [comments]
      summary: Add a comment and generate a simulated netizen reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComment"
      responses:
        "201":
          description: User comment and optional fake netizen reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCreateResponse"
        "400":
          description: Invalid comment
        "502":
          description: Comment service unavailable
  /issue-submissions:
    post:
      operationId: createIssueSubmission
      tags: [issue-submissions]
      summary: Deliver an issue submission without database persistence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSubmissionInput"
      responses:
        "200":
          description: Submission delivered to Discord or queued locally when no webhook is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSubmissionResponse"
        "400":
          description: Invalid issue submission
        "502":
          description: Discord webhook unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Comment:
      type: object
      properties:
        id:
          type: string
        issue_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - issue_id
        - author
        - content
    CreateComment:
      type: object
      properties:
        issue_id:
          type: string
        author:
          type: string
        content:
          type: string
          maxLength: 1000
      required:
        - issue_id
        - author
        - content
    CommentCreateResponse:
      type: object
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
        botComment:
          anyOf:
            - $ref: "#/components/schemas/Comment"
            - type: "null"
        warning:
          type: string
      required:
        - comment
        - botComment
    IssueSubmissionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 4000
        author:
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 254
      required:
        - title
        - category
        - description
    IssueSubmissionResponse:
      type: object
      properties:
        success:
          type: boolean
        delivery:
          type: string
          enum: [discord, local]
      required:
        - success
        - delivery

